<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airdrop Info</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 3px 3px 7px rgba(0, 0, 0, 0.5);
            animation: slideInDown 1.5s ease-out;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        .button-container button {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .button-container button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
        }

        .button-container button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .hidden {
            display: none;
        }

        .input-container {
            margin: 10px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>Airdrop Info</h1>
    <div class="button-container">
        <button onclick="openLink('https://t.me/blum/app?startapp=ref_TNm8bT089i')">BLUM</button>
        <button onclick="openLink('https://t.me/dotcoin_bot?start=r_1482000860')">Dotcoin</button>
        <button onclick="openLink('https://t.me/TimeFarmCryptoBot?start=18rmLjRhDh701g5a8')">Timefarm</button>
        <button onclick="openLink('https://yourlink.com/wcoin')">W-Coin</button>
        <button onclick="openLink('https://yourlink.com/dormind')">Dormind</button>
        <button onclick="openLink('https://yourlink.com/cathea')">Cathea</button>
        <button onclick="openLink('https://yourlink.com/bums')">Bums</button>
        <button id="tapswapButton">Tapswap</button>
        <button onclick="openLink('https://yourlink.com/bonkers')">Bonkers</button>
        <button onclick="openLink('https://www.y2mate.com/en858/download-youtube')">YOUTUBE</button>
    </div>

    <div id="inputSection" class="hidden">
        <label for="songInput">Send me the song name:</label>
        <div class="input-container">
            <input type="text" id="songInput" placeholder="Type song name here...">
        </div>
        <button id="goButton">GO</button>
    </div>

    <script>
        function openLink(url) {
            window.open(url, '_blank');
        }

        document.getElementById('tapswapButton').addEventListener('click', function () {
            // Show the input section
            document.getElementById('inputSection').classList.remove('hidden');
        });

        document.getElementById('goButton').addEventListener('click', function () {
            // Get the typed song name
            const songName = document.getElementById('songInput').value.trim();

            if (songName) {
                // Format the message to send
                const message = `/find ${songName}`;

                // Redirect to the Telegram bot with the message
                const telegramLink = `https://t.me/The_Shazam_BOT?start=${encodeURIComponent(message)}`;
                window.open(telegramLink, '_blank');
            } else {
                alert('Please type a song name.');
            }
        });
    </script>
</body>
</html>
